# Every push and pull request: typecheck, the full test suite (incl. real Chrome, Firefox and WebKit,
# generated Python and Go clients), the website's link/contrast checks, and the package as users get it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Use the Azure Ubuntu mirror
        # Runners hosted on AWS use the regional EC2 mirror, which repeatedly stalled WebKit's
        # 125 MB of packages for 10+ minutes; the Azure mirror delivered them in 12-23 s.
        run: sudo sed -i -E 's#https?://[^ /]*archive\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
      - name: Install WebKit (Playwright build) with its system dependencies
        timeout-minutes: 10
        run: npx playwright-core install --with-deps webkit
      - run: npm run typecheck
      - name: Test
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
          FIREFOX_PATH: /usr/bin/firefox
          APUE_TEST_SYSTEM_CA: '1'  # the Swift client test trusts its server through the system store (sudo)
      - name: Website (build is reproducible, links, anchors, metadata, contrast)
        run: |
          node site-src/build.mjs
          git diff --exit-code -- site
          node site-src/check.mjs
      - run: npm run build
      - run: npm run verify:package
