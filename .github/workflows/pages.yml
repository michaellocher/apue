# Publishes the website (site/, generated from site-src/) to GitHub Pages on changes to main.
# Custom domain: add a site/CNAME file with "apue.dev" once the domain is registered and its DNS
# points to GitHub Pages (https://docs.github.com/pages/configuring-a-custom-domain-for-your-github-pages-site).
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, site-src/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Opt-in: publishing makes the site public. Enable Pages (Settings → Pages → Source: GitHub
    # Actions) and set the repository variable PAGES_ENABLED=true.
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: The committed site matches its sources and passes the checks
        run: |
          node site-src/build.mjs
          git diff --exit-code -- site
          node site-src/check.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
