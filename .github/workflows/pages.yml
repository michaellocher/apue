# Publishes the website (site/, generated from site-src/) to GitHub Pages on changes to main.
# Served at https://michaellocher.github.io/apue/ (ORIGIN in site-src/build.mjs): the problem type
# URIs in src/ resolve to pages here, so this address is part of the protocol.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, site-src/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: The committed site matches its sources and passes the checks
        run: |
          node site-src/build.mjs
          git diff --exit-code -- site
          node site-src/check.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
