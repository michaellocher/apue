# Releases on a version tag without "v" prefix (e.g. 0.1.0-beta.1, 0.1.0): verifies everything,
# publishes to npm (pre-releases under the "beta" dist-tag; with provenance once the repository is
# public — npm generates none for private repositories) and creates a GitHub release with the
# package tarball and the changelog section. Needs the secret NPM_TOKEN (environment "npm").
# Run it by hand (Actions → Release → Run workflow) for a dry run of the whole pipeline: everything
# up to `npm publish --dry-run`, no secret needed, nothing published.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The dry run needs no secret, so it doesn't wait for the environment's reviewer.
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: The tag is the package version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$DRY_RUN" != true ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: The changelog has a dated entry for this version
        run: |
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          if grep -q "^## $VERSION .*unreleased" CHANGELOG.md; then
            if [ "$DRY_RUN" = true ]; then echo "::warning::the CHANGELOG entry for $VERSION is still marked unreleased"
            else echo "::error::date the CHANGELOG entry for $VERSION before tagging"; exit 1; fi
          fi
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - run: npm run typecheck
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
          FIREFOX_PATH: /usr/bin/firefox
          APUE_TEST_SYSTEM_CA: '1'  # the Swift client test trusts its server through the system store (sudo)
      - run: npm run build
      - run: npm run verify:package
      - name: Pack
        run: npm pack --ignore-scripts
      - name: Publish to npm
        run: |
          case "$VERSION" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          # npm generates no provenance for private repositories (the publish would fail with it).
          provenance=--provenance
          [ "$PRIVATE" = true ] && provenance=
          dry=
          [ "$DRY_RUN" = true ] && dry=--dry-run
          npm publish --ignore-scripts $provenance $dry --access public --tag "$tag"
        env:
          PRIVATE: ${{ github.event.repository.private }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release notes from the changelog
        run: |
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::empty release notes"; exit 1; }
          cat release-notes.md
      - if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apue-*.tgz
