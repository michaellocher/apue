# Releases on a version tag without "v" prefix (e.g. 0.1.0-beta.1, 0.1.0): verifies everything,
# publishes to npm with provenance (pre-releases under the "beta" dist-tag), and creates a GitHub
# release with the package tarball and the changelog section. Needs the repository secret NPM_TOKEN.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: The tag is the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: The changelog has an entry for this version
        run: grep -q "^## $GITHUB_REF_NAME" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - run: npm run typecheck
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
          FIREFOX_PATH: /usr/bin/firefox
      - run: npm run build
      - run: npm run verify:package
      - name: Pack
        run: npm pack --ignore-scripts
      - name: Publish to npm
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          npm publish --ignore-scripts --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release notes from the changelog
        run: awk -v v="## $GITHUB_REF_NAME" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apue-*.tgz
