# Releases on a version tag without "v" prefix (e.g. 0.1.0-beta.1, 0.1.0): verifies everything and
# creates a GitHub release with the package tarball and the changelog section. There is no registry:
# users install the release's tarball by URL (README, "Install"), and the last step does exactly
# that. Run it by hand (Actions → Release → Run workflow) for a dry run: everything but the release.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write  # the GitHub release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: The tag is the package version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$DRY_RUN" != true ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: The changelog has a dated entry for this version
        run: |
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          if grep -q "^## $VERSION .*unreleased" CHANGELOG.md; then
            if [ "$DRY_RUN" = true ]; then echo "::warning::the CHANGELOG entry for $VERSION is still marked unreleased"
            else echo "::error::date the CHANGELOG entry for $VERSION before tagging"; exit 1; fi
          fi
      - run: npm ci
      - name: Use the Azure Ubuntu mirror
        # Runners hosted on AWS use the regional EC2 mirror, which repeatedly stalled WebKit's
        # 125 MB of packages for 10+ minutes; the Azure mirror delivered them in 12-23 s.
        run: sudo sed -i -E 's#https?://[^ /]*archive\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
      - name: Install WebKit (Playwright build) with its system dependencies
        timeout-minutes: 10
        run: npx playwright-core install --with-deps webkit
      - run: npm run typecheck
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
          FIREFOX_PATH: /usr/bin/firefox
          APUE_TEST_SYSTEM_CA: '1'  # the Swift client test trusts its server through the system store (sudo)
      - run: npm run build
      - run: npm run verify:package
      - name: Pack
        run: npm pack --ignore-scripts
      - name: The tarball is the one the README installs
        run: |
          file="michaellocher-apue-$VERSION.tgz"
          test -f "$file" || { echo "::error::npm pack did not write $file"; exit 1; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$file"
          grep -qF "npm install $url" README.md || { echo "::error::README.md does not install $url"; exit 1; }
          echo "TARBALL=$file" >> "$GITHUB_ENV"
          echo "TARBALL_URL=$url" >> "$GITHUB_ENV"
      - name: Release notes from the changelog
        run: |
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::empty release notes"; exit 1; }
          cat release-notes.md
      - if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ env.TARBALL }}
      - if: env.DRY_RUN != 'true'
        name: Install the release the way users do
        run: |
          for i in 1 2 3 4 5 6; do curl -fsSL -o downloaded.tgz "$TARBALL_URL" && break; sleep 10; done
          test -s downloaded.tgz || { echo "::error::cannot download $TARBALL_URL"; exit 1; }
          cmp downloaded.tgz "$TARBALL" || { echo "::error::the release asset differs from the packed tarball"; exit 1; }
          app=$(mktemp -d) && cd "$app"
          npm init -y > /dev/null && npm pkg set type=module
          npm install --no-audit --no-fund "$TARBALL_URL"
          node --input-type=module -e '
            const { exports } = JSON.parse(await (await import("node:fs/promises")).readFile("node_modules/@michaellocher/apue/package.json", "utf8"));
            for (const entry of Object.keys(exports).filter((e) => e !== "./package.json")) await import(`@michaellocher/apue${entry.slice(1)}`);
            console.log("imported", Object.keys(exports).length - 1, "entry points");'
          test -x node_modules/.bin/apue-types
