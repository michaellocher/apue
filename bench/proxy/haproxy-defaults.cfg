# Minimal HAProxy: TLS + h2 to clients, TLS + h2 (ALPN) to apü, default buffering behaviour.
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h
frontend fe
  bind :443 ssl crt /certs/combined.pem alpn h2,http/1.1
  default_backend be
backend be
  server apue apue:8443 ssl verify none alpn h2,http/1.1
