# Reverse proxy configured for apü: no request/response buffering, WebSocket upgrades, long reads.
events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }
  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location / {
      proxy_pass https://apue:8443;
      proxy_http_version 1.1;
      proxy_request_buffering off;   # stream request bodies (client/bidi streams)
      proxy_buffering off;           # stream responses (apü also sends X-Accel-Buffering: no)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;      # apü heartbeats every 15 s keep streams alive anyway
    }
  }
}
