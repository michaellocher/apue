# nginx in front of several apü replicas (docs/deployment.md). Uploads and download resources live
# in the replica that created them; their ids carry its name (server option `instance`):
#   /$uploads/eu-1.<id>, /$downloads/eu-1.<id>   → routed by path
#   a call referencing uploads: header apue-replica: eu-1 (sent by ApueClient)  → routed by header
# Everything else is stateless across replicas (shared resume secret, shared idempotency store) and
# is balanced freely. Verified end to end by scripts/verify-deployment.ts (nginx 1.29).
events {}

http {
  map $uri $apue_by_path {
    "~^/\$(uploads|downloads)/(?<replica>[A-Za-z0-9-]+)\." $replica;
    default "";
  }
  map "$apue_by_path:$http_apue_replica" $apue_upstream {
    "~^(?<p>[A-Za-z0-9-]+):" apue_$p;   # path first
    "~^:(?<h>[A-Za-z0-9-]+)$" apue_$h;  # then the header
    default apue_all;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  # One group per replica (named after its `instance`) plus one with all of them.
  upstream apue_all { server REPLICA_1; server REPLICA_2; }
  upstream apue_eu-1 { server REPLICA_1; }
  upstream apue_eu-2 { server REPLICA_2; }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    client_max_body_size 0;          # uploads are limited by the apü server (uploads.maxBytes)
    proxy_request_buffering off;     # stream request bodies (client streams, uploads)
    proxy_buffering off;             # stream responses (frames, SSE) without delay
    proxy_read_timeout 1h;           # long-lived streams; apü sends heartbeats

    location / {
      proxy_pass https://$apue_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;          # WebSocket tier (T3)
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
